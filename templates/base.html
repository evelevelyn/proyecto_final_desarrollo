<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#effaf2" />
    <meta name="description" content="EcoTij: comunidad para aprender y explorar acciones ecológicas en Tijuana." />
    <link rel="icon" href="{{ url_for('static', filename='images/ecotij-mark.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    <title>EcoTij — Comunidad ecológica de Tijuana</title>
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4c-7 0-13 2-15 7a6 6 0 0 0 8 8c5-2 7-8 7-15Z"/><path d="M5 19c3-5 7-8 12-11"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
      <symbol id="i-badge-check" viewBox="0 0 24 24"><path d="m12 3 2.2 1.3 2.6-.2 1.1 2.4 2.2 1.4-.6 2.5.6 2.5-2.2 1.4-1.1 2.4-2.6-.2L12 18l-2.2-1.3-2.6.2-1.1-2.4-2.2-1.4.6-2.5-.6-2.5 2.2-1.4 1.1-2.4 2.6.2L12 3Z"/><path d="m9 11 2 2 4-4"/></symbol>
      <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 7v14M3 18V5a2 2 0 0 1 2-2h2a5 5 0 0 1 5 5 5 5 0 0 1 5-5h2a2 2 0 0 1 2 2v13h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3Z"/></symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-flower" viewBox="0 0 24 24"><path d="M12 12c-2-2-1-6 1-7 2-1 4 0 4 2 0 2-3 4-5 5ZM12 12c2-2 6-1 7 1 1 2 0 4-2 4-2 0-4-3-5-5ZM12 12c2 2 1 6-1 7-2 1-4 0-4-2 0-2 3-4 5-5ZM12 12c-2 2-6 1-7-1-1-2 0-4 2-4 2 0 4 3 5 5Z"/><circle cx="12" cy="12" r="2"/><path d="M12 14v8m0-4-3 2"/></symbol>
      <symbol id="i-hand-heart" viewBox="0 0 24 24"><path d="M11 11h2l2-2a2 2 0 0 1 3 3l-4 4a3 3 0 0 1-2 1H8l-4 3M4 13h4l2 2"/><path d="M17 3a2 2 0 0 0-3 0l-.5.5L13 3a2 2 0 0 0-3 3l3.5 3L17 6a2 2 0 0 0 0-3Z"/><path d="m4 11 3 3-3 3-3-3 3-3Z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
      <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 22v-9M12 14C4 14 4 7 4 7s7-1 8 6M12 11c0-7 8-7 8-7s0 7-8 7"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><path d="m12 2 6 7h-3l5 6h-5v7H9v-7H4l5-6H6l6-7Z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
      <symbol id="i-waves" viewBox="0 0 24 24"><path d="M2 8c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M2 14c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M2 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    </svg>

    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="header-brand" href="#inicio" data-page-nav aria-label="EcoTij, volver al inicio">
          <span class="brand-mark">
            <span class="brand-mark__leaf"><svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg></span>
            <span class="brand-mark__word">Eco<span>Tij</span></span>
          </span>
        </a>
        <nav class="main-nav" id="section-navigation" aria-label="Secciones de EcoTij">
          <a href="#inicio" data-page-nav>Inicio</a>
          <a href="#plantas" data-page-nav>Plantas nativas</a>
          <a href="#aprende" data-page-nav>Formación</a>
          <a href="#colectivos" data-page-nav>Colectivos</a>
          <a href="#agenda" data-page-nav>Agenda</a>
          <a href="#aliados" data-page-nav>Aliados</a>
          <a href="#participa" data-page-nav>Participa</a>
          <a href="#prototipo" data-page-nav>Acerca</a>
        </nav>
      </div>
    </header>

    <noscript><p class="no-script-note">Para cambiar entre secciones, activa JavaScript en tu navegador. La página no usa datos ni servicios externos.</p></noscript>
    {% block content %}{% endblock %}

    <footer class="site-footer" data-site-footer hidden>
      <span>EcoTij · Prototipo de comunidad ecológica en Tijuana</span>
      <a href="#prototipo" data-page-nav>Acerca de esta vista <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
    </footer>

    <dialog class="group-dialog" id="group-dialog" aria-labelledby="group-dialog-title">
      <div id="group-dialog-content"></div>
    </dialog>
    <div class="status-toast" id="status-toast" role="status" aria-live="polite" hidden>
      <span class="status-toast__icon"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></span>
      <span id="status-message"></span>
      <button type="button" id="status-close" aria-label="Cerrar mensaje"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
    </div>
  </body>
</html>
